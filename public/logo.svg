<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E5E8"/>
      <stop offset="100%" stop-color="#9A9A9F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2C07D"/>
      <stop offset="100%" stop-color="#C8A95A"/>
    </linearGradient>
  </defs>

  <!-- Left bracket -->
  <rect x="4"  y="10" width="3"  height="60" fill="url(#gold)"/>
  <rect x="4"  y="10" width="14" height="3"  fill="url(#gold)"/>
  <rect x="4"  y="67" width="14" height="3"  fill="url(#gold)"/>

  <!-- MCL monogram -->
  <text
    x="24"
    y="58"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="50"
    letter-spacing="-1"
    fill="url(#plate)"
  >MCL</text>

  <!-- Vertical divider -->
  <rect x="158" y="14" width="1.5" height="52" fill="#3A3A3D"/>

  <!-- MIKEBERLTIN wordmark — centred in right half (x=168 to x=336, mid=252) -->
  <text
    x="252"
    y="38"
    font-family="'Courier New', monospace"
    font-weight="700"
    font-size="15"
    letter-spacing="5"
    text-anchor="middle"
    fill="url(#plate)"
  >MIKEBERLTIN</text>

  <!-- Thin gold rule — centred under wordmark -->
  <rect x="185" y="46" width="134" height="1" fill="url(#gold)" opacity="0.6"/>

  <!-- Right bracket -->
  <rect x="333" y="10" width="3"  height="60" fill="url(#gold)"/>
  <rect x="323" y="10" width="14" height="3"  fill="url(#gold)"/>
  <rect x="323" y="67" width="14" height="3"  fill="url(#gold)"/>
</svg>
